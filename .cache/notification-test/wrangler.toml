name = "rsk-notification-isolated-test"
main = "../../src/worker.ts"
compatibility_date = "2025-01-29"
assets = { directory = "../../dist", binding = "ASSETS", not_found_handling = "single-page-application" }

[vars]
OWNER_USERNAME = "TestBootstrapUnused"
OWNER_PASSWORD_HASH = "test-only-unused-hash"
SESSION_SECRET = "test-only-session-secret-not-for-production"
VAPID_PUBLIC_KEY = "test-only-public-key"
VAPID_PRIVATE_KEY = "test-only-private-key"
PUSH_TEST_MODE = "1"

[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "notification-isolated-test-db"
database_id = "notification-isolated-test-db"
migrations_dir = "../../migrations"
