name = "rsk-isolated-http-verification"
main = "../../src/worker.ts"
compatibility_date = "2025-01-29"
assets = { directory = "../../dist", binding = "ASSETS", not_found_handling = "single-page-application" }

[vars]
OWNER_USERNAME = "Admin"
OWNER_PASSWORD_HASH = "pbkdf2$210000$3G8tkjapN7RYnqTBT8XLiA$FLTIbFcFmXsCjPZXZ75NWjHs8jaOp3yiJUiks4zSM-c"
SESSION_SECRET = "isolated-http-verification-session-secret"
